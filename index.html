function prepareTables(root){
 tableObservers.get(root)?.disconnect();
 const observer=new ResizeObserver(entries=>{
  for(const {target} of entries){
   const wide=target.scrollWidth>target.clientWidth+1;
   target.classList.toggle('wide-table',wide);
   if(wide){
    target.tabIndex=0;
    target.setAttribute('role','region');
    const heading=target.closest('.panel')?.querySelector('h2')||root.querySelector('h2');
    target.setAttribute('aria-label',(heading?.textContent||'Таблица')+'. Горизонтальная прокрутка');
   }else{
    for(const attr of ['tabindex','role','aria-label'])target.removeAttribute(attr);
   }
  }
 });
 tableObservers.set(root,observer);
 root.querySelectorAll('.scroll').forEach(el=>observer.observe(el));
}

 if(a&&b&&JSON.stringify(a)===JSON.stringify(b))return [];
 const label=!a?'Включена в версию':!b?'Отсутствует в версии':a.volume!==b.volume?'Изменён объём':'Изменены реквизиты';

 })
}

const previousStocks = {
 '31.10.2025': {'S-003':{value:1, basis:'Заявленный объём',source:'DEMO-INV-2025-03'},'S-001':{value:0,basis:'Заявленный объём',source:'DEMO-ZERO-2025-01'}},
 '31.10.2024': {'S-003':{value:0.9,basis:'Эквивалентный объём после кондиционирования',source:'DEMO-EQV-2024-03'}}
};
function annualComparison(){
 const prior=previousStocks[st.compareDate||'31.10.2025'];
 return sites.filter(([id])=>!st.natSite||st.natSite===id).map(([id,name])=>{
  const before=prior[id],kind=declaration(id).kind;
  const records=stock().filter(o=>o.site===id&&o.type==='Фактический запас');
  const current=kind==='missing'?null:records.length?records.reduce((n,o)=>n+o.volume,0):kind==='zero'?0:null;
  const reason=!before?'Нет сведений за базовый период':current===null?'Нет сведений о запасе на текущую дату':before.basis!=='Заявленный объём'?'Разные основания измерения':'Сопоставимые данные';
  const diff=reason==='Сопоставимые данные'?+(current-before.value).toFixed(8):null;
  return {id,name,before,current,diff,reason,source:current===null?'':records.map(o=>o.source).join(', ')||(kind==='zero'?'Нулевая декларация':'')};
 });
}
function comparisonTable(){

const sectorAssignments=new Map([['W-001',{label:'Научные исследования',source:'DEMO-ORIGIN-01'}]]);
function sectorInfo(o){return sectorAssignments.get(o.id)||{label:'Сектор не указан',source:null}}
function sectorGroups(rows){
 const groups=new Map();
 for(const o of rows){

 }

}

}

const receiptHistory = new Map();
function compareReceipt(packages, raw) {
 const text = raw.trim().toUpperCase();
 const observed = text === 'НЕТ' ? [] : text.split(/[\s,;]+/).filter(Boolean);
 if ((!observed.length && text !== 'НЕТ') || observed.some(id=>!/^PKG-[A-Z0-9-]+$/.test(id))) return null;
 const declared = new Set(packages.map(p=>p.id));
 const counts = new Map();
 for (const id of observed) counts.set(id,(counts.get(id)||0)+1);
 const matched = [...declared].filter(id=>counts.has(id));
 const missing = [...declared].filter(id=>!counts.has(id));
 const extra = [...counts.keys()].filter(id=>!declared.has(id));
 const duplicates = [...counts].filter(([,n])=>n>1).map(([id,n])=>id+' × '+n);
 return {matched,missing,extra,duplicates,clean:!(missing.length||extra.length||duplicates.length)};
}
